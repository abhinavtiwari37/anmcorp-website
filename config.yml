# GitHub authentication requires an external OAuth gateway; see CMS_SETUP.md.
backend:
  name: github
  repo: abhinavtiwari37/anmcorp-website
  branch: main
  # After deploying a trusted OAuth gateway, uncomment and replace:
  # base_url: https://YOUR-AUTH-GATEWAY.example
  # auth_endpoint: auth

media_folder: uploads
public_folder: /uploads
publish: true
site_url: https://www.anmcorp.in
display_url: https://www.anmcorp.in
logo_url: /anmlogo.png
collections:
  - name: company
    label: Company Profile
    files:
      - label: Company Information
        name: company
        file: content/company.json
        fields:
          - {label: Hero Title, name: hero_title, widget: string}
          - {label: Hero Description, name: hero_description, widget: text}
          - {label: About Heading, name: about_title, widget: string}
          - {label: About Introduction, name: about_intro, widget: text}
          - label: About Paragraphs
            name: about_paragraphs
            widget: list
            field: {label: Paragraph, name: paragraph, widget: text}
          - {label: Vision, name: vision, widget: text}
          - {label: Mission, name: mission, widget: text}
          - {label: Contact Email, name: contact_email, widget: string}
  - name: leadership
    label: Leadership
    files:
      - label: Directors
        name: leadership
        file: content/leadership.json
        fields:
          - label: People
            name: people
            widget: list
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Role, name: role, widget: string}
              - {label: Photo, name: photo, widget: image}
              - {label: Biography, name: bio, widget: text}
              - {label: LinkedIn URL, name: linkedin, widget: string, required: false}
  - name: updates
    label: Website Updates
    files:
      - label: Projects
        name: projects
        file: content/projects.json
        fields:
          - label: Projects
            name: items
            widget: list
            fields:
              - {label: Project Title, name: title, widget: string}
              - {label: Location, name: location, widget: string, required: false}
              - {label: Description, name: description, widget: text}
              - {label: Photo, name: image, widget: image, required: false}
      - label: Photo Gallery
        name: gallery
        file: content/gallery.json
        fields:
          - label: Photos
            name: items
            widget: list
            fields:
              - {label: Caption, name: title, widget: string}
              - {label: Image, name: image, widget: image}
              - {label: Description, name: description, widget: text, required: false}
      - label: Careers
        name: careers
        file: content/careers.json
        fields:
          - label: Open Positions
            name: items
            widget: list
            fields:
              - {label: Job Title, name: title, widget: string}
              - {label: Location, name: location, widget: string, required: false}
              - {label: Description, name: description, widget: text}
      - label: News & Announcements
        name: news
        file: content/news.json
        fields:
          - label: Announcements
            name: items
            widget: list
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, time_format: false}
              - {label: Description, name: description, widget: text}
